<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Demo</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Bank Account</h1>

    <div class="info">
        <p><strong>Account Holder:</strong> <span id="owner"></span></p>
        <p><strong>Account Type:</strong> <span id="type"></span></p>
        <p><strong>Interest Rate:</strong> <span id="interest"></span>%</p>
    </div>

    <div class="balance">
        <p>Current Balance</p>
        <h2>₹<span id="balance"></span></h2>
    </div>

    <label>Amount</label>
    <input
        type="number"
        id="amount"
        placeholder="Enter amount"
    >

    <div>
        <button onclick="depositMoney()">Deposit</button>
        <button onclick="withdrawMoney()">Withdraw</button>
        <button onclick="showBalance()">Check Balance</button>
    </div>

    <p id="message"></p>

</div>

<script src="script.js"></script>

</body>
</html>
